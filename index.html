html,body{margin:0;height:100%;background:#07080c;color:#f3f5f7;font-family:-apple-system,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.bg{position:fixed;inset:0;filter:blur(60px);opacity:.9;z-index:0}
.bg i{position:absolute;border-radius:50%}
.bg i:nth-child(1){width:80vw;height:80vw;left:-20vw;top:-10vh;background:#c6ff3d55;animation:f1 18s ease-in-out infinite}
.bg i:nth-child(2){width:70vw;height:70vw;right:-25vw;top:30vh;background:#8b7bff66;animation:f2 22s ease-in-out infinite}
.bg i:nth-child(3){width:60vw;height:60vw;left:0;bottom:-15vh;background:#22b8f044;animation:f1 26s ease-in-out infinite reverse}
@keyframes f1{50%{transform:translate(8vw,6vh) scale(1.12)}}@keyframes f2{50%{transform:translate(-10vw,8vh) scale(.9)}}
#g{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
.panel{width:100%;max-width:360px;padding:30px 22px 22px;border-radius:34px;background:linear-gradient(155deg,rgba(255,255,255,.12),rgba(255,255,255,.04) 60%);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 20px 60px rgba(0,0,0,.45);box-sizing:border-box}
.logo{width:78px;height:78px;margin:0 auto;border-radius:20px;overflow:hidden;box-shadow:0 10px 34px #c6ff3d44}.logo svg{width:78px;height:78px;display:block}
h1{font-weight:800;letter-spacing:.14em;margin:18px 0 4px;font-size:22px}
p{color:rgba(243,245,247,.65);font-size:14px;margin:0 0 22px;line-height:1.45}
form{width:100%}
input[type=password]{width:100%;box-sizing:border-box;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);color:#f3f5f7;border-radius:18px;padding:16px;font-size:17px;outline:none}
input[type=password]:focus{border-color:#c6ff3daa;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 4px #c6ff3d22}
button{width:100%;margin-top:12px;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:16px;font-size:17px;font-weight:800;color:#0a0c08;font-family:inherit;background:linear-gradient(180deg,#e2ff9a,#c6ff3d 55%,#aee52f);box-shadow:inset 0 1px 1px rgba(255,255,255,.8),0 10px 28px #c6ff3d55}
button:disabled{opacity:.6}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;color:rgba(243,245,247,.6);font-size:13px}
.err{color:#ff6b80;font-size:14px;min-height:20px;margin-top:12px;font-weight:700}
.v{position:fixed;z-index:1;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;color:rgba(255,255,255,.35);font-size:11px;letter-spacing:.08em;text-align:center}
.hide{display:none}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}.shake{animation:sh .4s}

const C=crypto.subtle,te=new TextEncoder(),$=id=>document.getElementById(id);
const ub=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const db=()=>new Promise((res,rej)=>{const r=indexedDB.open('velox-gate',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbGet(){try{const d=await db();return await new Promise(r=>{const q=d.transaction('k').objectStore('k').get('aes');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function idbPut(v){const d=await db();await new Promise((res,rej)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,'aes');t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function stored(){const v=await idbGet();if(v&&v.s===G.s&&v.key)return v.key;const raw=localStorage.getItem('velox.gateRaw');if(raw)try{const o=JSON.parse(raw);if(o.s===G.s)return await C.importKey('raw',ub(o.k),'AES-GCM',false,['encrypt','decrypt'])}catch(e){}return null}
async function derive(pw,extractable){const base=await C.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return C.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:ub(G.s),iterations:G.n},base,{name:'AES-GCM',length:256},extractable,['encrypt','decrypt'])}
async function openBox(key){
  const pt=await C.decrypt({name:'AES-GCM',iv:ub(G.i)},key,ub(G.c));
  const html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  window.__veloxGate=1;window.__veloxSrc=html;try{sessionStorage.setItem('velox.gated','1')}catch(e){}
  document.open();document.write(html);document.close()}
function ask(msg){$('g').classList.remove('hide');if(msg)$('e').textContent=msg;setTimeout(()=>$('pw').focus(),300)}
$('f').onsubmit=async ev=>{ev.preventDefault();const b=$('b');b.disabled=true;b.textContent='Prüfe …';$('e').textContent='';
  const pw=$('pw').value;let key;
  try{key=await derive(pw,false);await C.decrypt({name:'AES-GCM',iv:ub(G.i)},key,ub(G.c))}
  catch(e){b.disabled=false;b.textContent='Entsperren';$('e').textContent='Falsches Passwort';const f=$('f');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');$('pw').select();return}
  try{if($('rem').checked){try{await idbPut({key,s:G.s,n:G.n})}catch(e){const xk=await derive(pw,true),raw=new Uint8Array(await C.exportKey('raw',xk));let s='';raw.forEach(c=>s+=String.fromCharCode(c));localStorage.setItem('velox.gateRaw',JSON.stringify({s:G.s,n:G.n,k:btoa(s)}))}}
    b.textContent='Öffne …';await openBox(key)}
  catch(e){b.disabled=false;b.textContent='Entsperren';$('e').textContent='Konnte nicht öffnen: '+(e.message||e)}};
(async()=>{if(!window.crypto||!C||typeof DecompressionStream==='undefined'){ask('Dieser Browser ist zu alt für VELOX (iOS 16.4+ nötig).');return}
  const k=await stored();if(k){try{await openBox(k);return}catch(e){}}ask()})();
})();
