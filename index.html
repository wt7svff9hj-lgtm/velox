<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VELOX">
<meta name="theme-color" content="#08090c">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>VELOX – Dein Trainingscoach</title>
<link rel="icon" id="favicon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#08090c;--card:#12151a;--card2:#1c2027;--text:#f3f5f8;--muted:#8b94a5;--accent:#c6ff3d;--accentText:#0a0c08;
  --good:#3ddc84;--warn:#ffb020;--bad:#ff4d6a;
  --c-run:#ff6a3d;--c-ride:#3dd6ff;--c-zwift:#8b7bff;--c-swim:#2fe0b0;--c-strength:#ffc93d;--c-walk:#9aa3b2;--c-other:#e86bd1;
  --z1:#5b8def;--z2:#3ddc84;--z3:#ffd23d;--z35:#ffab2e;--z4:#ff7a2e;--z5:#ff4d6a;--z6:#d94dff;
  --r:22px;--ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;font-size:15px;line-height:1.42;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
svg.i.f{fill:currentColor;stroke:none}
.aurora{position:fixed;inset:-20vh -20vw auto;height:70vh;z-index:-1;pointer-events:none;filter:blur(60px);opacity:.5}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen}
.aurora i:nth-child(1){width:46vw;height:46vw;left:10vw;top:8vh;background:color-mix(in srgb,var(--accent) 45%,transparent);animation:float1 18s ease-in-out infinite}
.aurora i:nth-child(2){width:38vw;height:38vw;right:6vw;top:0;background:color-mix(in srgb,var(--c-zwift) 40%,transparent);animation:float2 22s ease-in-out infinite}
.aurora i:nth-child(3){width:30vw;height:30vw;left:42vw;top:24vh;background:color-mix(in srgb,var(--c-run) 32%,transparent);animation:float1 26s ease-in-out infinite reverse}
@keyframes float1{50%{transform:translate(8vw,6vh) scale(1.15)}}
@keyframes float2{50%{transform:translate(-10vw,8vh) scale(.9)}}
.noanim .aurora i,.noanim *{animation:none!important;transition:none!important}
.light .aurora{opacity:.25}
.wrap{max-width:1120px;margin:0 auto;padding:10px 16px 28px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 4px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-style:italic;letter-spacing:.06em;font-size:18px}
.brand svg{width:34px;height:34px;border-radius:10px;box-shadow:0 4px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.greet{margin:14px 0 4px}
.greet .hi{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;font-size:14px}
.greet .hi svg{color:var(--accent);font-size:18px}
h1{font-size:34px;font-weight:900;font-style:italic;letter-spacing:-.025em;margin:2px 0 4px;line-height:1.05;text-transform:uppercase}
.emo{display:inline-block;font-style:normal;animation:wave 2.4s ease-in-out 1s 2;transform-origin:70% 80%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-8deg)}}
.h1s{color:var(--muted);font-size:14.5px}
h2{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:26px 4px 10px;display:flex;align-items:center;gap:8px}
h2 .line{flex:1;height:1px;background:linear-gradient(90deg,var(--card2),transparent)}
h2 a{color:var(--accent);text-decoration:none;font-size:12px;letter-spacing:.06em;cursor:pointer}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:780px){.grid.g2{grid-template-columns:1fr 1fr}.grid.g3{grid-template-columns:repeat(3,1fr)}.span2{grid-column:span 2}}
.grid.k2{grid-template-columns:1fr 1fr}
@media(min-width:780px){.grid.k2{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--text) 5%,transparent)}
.fade{animation:fadeUp .5s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lbl{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.big{font-size:36px;font-weight:900;font-style:italic;letter-spacing:-.03em;line-height:1}
.mid{font-size:20px;font-weight:850;letter-spacing:-.015em}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.term{text-decoration:underline dotted;text-underline-offset:3px;text-decoration-thickness:1.5px;cursor:help}
.qi{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:color-mix(in srgb,currentColor 18%,transparent);font-size:10px;font-weight:900;font-style:normal;margin-left:4px;vertical-align:1px;cursor:help;text-transform:none;letter-spacing:0}
.hero{color:var(--accentText);background:var(--accent);padding:18px;isolation:isolate;border:0}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,#fff 35%,transparent),transparent 55%),linear-gradient(140deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--bg)))}
.hero::after{content:"";position:absolute;inset:-50%;z-index:-1;background:linear-gradient(105deg,transparent 40%,color-mix(in srgb,#fff 28%,transparent) 50%,transparent 60%);animation:shine 5.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,60%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.hero .lbl,.hero .muted{color:color-mix(in srgb,var(--accentText) 68%,transparent)}
.hero .title{font-size:28px;font-weight:900;font-style:italic;letter-spacing:-.03em;line-height:1.04;margin:8px 0 6px;text-transform:uppercase}
.hero .chip{background:color-mix(in srgb,var(--accentText) 12%,transparent);color:var(--accentText)}
.hero .btn{background:color-mix(in srgb,var(--accentText) 14%,transparent);color:var(--accentText)}
.hero .btn.solid{background:var(--accentText);color:var(--accent)}
.hero .bigicon{position:absolute;right:-14px;bottom:-20px;font-size:150px;opacity:.13;z-index:-1;transform:rotate(-10deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:6px 10px;background:var(--card2);font-weight:750;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accentText)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:850;padding:3px 8px;border-radius:7px;background:var(--card2);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;vertical-align:1px}
.badge.acc{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.badge.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.btn{border:0;border-radius:13px;padding:11px 15px;font-weight:800;background:var(--card2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.96)}
.btn.acc{background:var(--accent);color:var(--accentText);box-shadow:0 6px 22px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.danger{background:color-mix(in srgb,var(--bad) 16%,var(--card2));color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.full{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--card2)}
.btn.cam{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--card)),var(--card));border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);width:100%;padding:14px;flex-direction:column;gap:2px}
.btn.cam small{font-weight:600;color:var(--muted);font-size:12px}
.btnrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats.s4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--card2);border-radius:13px;padding:10px 10px 9px;min-width:0}
.hero .stat{background:color-mix(in srgb,var(--accentText) 11%,transparent)}
.stat b{display:block;font-size:18px;font-weight:900;font-style:italic;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:800}
.hero .stat span{color:color-mix(in srgb,var(--accentText) 62%,transparent)}
.kpi .v{font-size:26px;font-weight:900;font-style:italic;letter-spacing:-.03em;margin-top:4px}
.kpi .d{font-size:12px;font-weight:800;margin-top:2px}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:23px;flex:none;color:#fff;position:relative;overflow:hidden}
.ico::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 55%);pointer-events:none}
.ico svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.list .item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--card2);cursor:pointer}
.list .item:last-child{border-bottom:0}
.item .t{font-weight:800}
.item .m{font-size:12.5px;color:var(--muted)}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.more>div{overflow:hidden}
.more.open{grid-template-rows:1fr}
.det{margin-top:14px;padding-top:14px;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.det h4{margin:14px 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;opacity:.75;display:flex;gap:6px;align-items:center}
.det ul{margin:4px 0;padding-left:18px}
.det li{margin:4px 0}
.steps{display:flex;flex-direction:column;gap:6px}
.stp{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start;padding:9px 10px;border-radius:12px;background:color-mix(in srgb,currentColor 7%,transparent)}
.stp .tm{font-size:12px;font-weight:800;opacity:.7;font-variant-numeric:tabular-nums}
.stp .nm{font-weight:850}
.stp .tg{font-size:13px;opacity:.85}
.zb{display:inline-block;font-size:10px;font-weight:900;padding:1px 6px;border-radius:5px;color:#111;margin-left:4px;vertical-align:1px}
.profile{display:flex;align-items:flex-end;gap:2px;height:46px;margin-top:12px}
.profile span{display:block;border-radius:4px 4px 2px 2px;min-width:3px;transform-origin:bottom;animation:grow .7s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{background:var(--card2);border-radius:13px;padding:8px 2px 7px;text-align:center;cursor:pointer;position:relative;transition:transform .15s}
.wd:active{transform:scale(.94)}
.wd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.wd .d{font-size:10.5px;color:var(--muted);font-weight:800;text-transform:uppercase}
.wd .n{font-weight:900;font-size:15px}
.wd .s{display:flex;justify-content:center;gap:2px;margin-top:4px;min-height:18px;font-size:16px}
.wd .s .pl{opacity:.38}
.wd.done::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--good)}
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;padding:8px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid color-mix(in srgb,var(--text) 8%,transparent);border-radius:24px;display:flex;justify-content:space-around;align-items:center;z-index:20;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:800;color:var(--muted);padding:5px 8px;cursor:pointer;min-width:58px;text-transform:uppercase;letter-spacing:.04em}
.tab svg{font-size:22px}
.tab.on{color:var(--accent)}
.fab{width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accentText);font-size:28px;display:grid;place-items:center;box-shadow:0 8px 28px color-mix(in srgb,var(--accent) 45%,transparent);cursor:pointer;transition:transform .2s var(--ease)}
.fab:active{transform:scale(.9) rotate(90deg)}
.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);margin-bottom:5px;text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{aspect-ratio:1/1.18;background:var(--card);border-radius:11px;padding:5px;display:flex;flex-direction:column;cursor:pointer;min-width:0;position:relative;transition:transform .15s}
.cd:active{transform:scale(.93)}
.cd.out{opacity:.28}
.cd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cd .n{font-size:12px;font-weight:800}
.cd .ics{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto;font-size:13px}
.cd .ics .pl{opacity:.38}
.cd .bar{position:absolute;left:5px;right:5px;bottom:3px;height:3px;border-radius:2px}
@media(min-width:780px){.cd{aspect-ratio:auto;min-height:90px}.cd .ics{font-size:17px}}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:40;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:93vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 16px calc(26px + env(safe-area-inset-bottom));animation:up .35s var(--ease);border-top:1px solid var(--card2)}
@media(min-width:780px){.overlay{align-items:center}.sheet{border-radius:28px;max-height:88vh}}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--card2);margin:4px auto 12px}
.field{margin:13px 0}
.field>label{display:block;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.inp{width:100%;background:var(--card);border:1px solid var(--card2);border-radius:13px;padding:12px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .3s}
.inp:focus{border-color:var(--accent)}
.inp.ocr{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
select.inp{appearance:none;-webkit-appearance:none}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sports{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sp{background:var(--card);border:2px solid transparent;border-radius:15px;padding:10px 2px 8px;text-align:center;cursor:pointer;font-size:10.5px;font-weight:800;transition:transform .15s,border-color .2s}
.sp:active{transform:scale(.94)}
.sp svg{font-size:26px;display:block;margin:0 auto 4px}
.sp.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:13px;padding:12px;margin-top:8px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--card2);position:relative;border:0;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .25s var(--ease)}
.sw.on{background:var(--accent)}
.sw.on::after{left:23px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{border:2px solid var(--card2);border-radius:14px;padding:6px 10px 6px 6px;display:flex;align-items:center;gap:8px;background:var(--card);cursor:pointer;font-weight:800;font-size:13px}
.swatch i{width:24px;height:24px;border-radius:8px;display:block}
.colorrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--card2)}
.colorrow:last-child{border:0}
.colorrow input[type=color]{width:46px;height:32px;border:0;border-radius:9px;background:none;padding:0;cursor:pointer}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:9.5px;font-weight:600}
.chart .draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.4s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .bar{transform-origin:bottom;transform-box:fill-box;animation:grow .8s var(--ease) both}
.bars{height:12px;border-radius:6px;background:var(--card2);overflow:hidden;display:flex}
.bars span{display:block;height:100%}
.prog{height:8px;border-radius:5px;background:var(--card2);overflow:hidden}
.prog span{display:block;height:100%;border-radius:5px;background:var(--accent)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--card2);padding:11px 16px;border-radius:14px;font-weight:800;z-index:80;opacity:0;transition:.3s var(--ease);pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--muted);padding:20px 8px;font-size:14px}
.empty svg{font-size:34px;color:var(--accent);display:block;margin:0 auto 8px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--card2)}
.kv:last-child{border:0}
.kv span{color:var(--muted)}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.syncdot.ok{background:var(--good)}.syncdot.err{background:var(--bad)}
.ins{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--card2)}
.ins:last-child{border:0}
.ins .dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:17px}
.ins b{display:block;font-weight:850}
.ins p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ring text{font-weight:900;font-style:italic}
.ring .arc{transition:stroke-dashoffset 1.3s var(--ease)}
.phase{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:12px;gap:2px}
.phase span{display:block;height:100%}
.phasewrap{position:relative}
.phasewrap .mk{position:absolute;top:-4px;width:3px;height:18px;border-radius:2px;background:var(--text);box-shadow:0 0 0 2px var(--card)}
.phasel{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-weight:800;margin-top:6px;text-transform:uppercase;letter-spacing:.05em}
.seg{display:flex;background:var(--card);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:10px;font-weight:800;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card2);color:var(--text)}
table.z{width:100%;border-collapse:collapse;font-size:13px}
table.z td{padding:7px 4px;border-bottom:1px solid var(--card2)}
table.z tr:last-child td{border:0}
table.z td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

.stage.open .s1{transition:transform .7s cubic-bezier(.6,0,.2,1);transform:translateY(-102%)}

const GL={
  belastung:['Belastung (Punkte)','Wie stark dich eine Einheit beansprucht – aus Dauer × Intensität berechnet. 1 Stunde voll an deiner Leistungsgrenze = 100 Punkte. Ein lockerer 45-min-Lauf ≈ 35, ein langer Lauf ≈ 80–120. International heißt das „TSS“ (Training Stress Score).'],
  fitness:['Fitness','Deine Trainingslast der letzten ~6 Wochen (gleitender Durchschnitt der Belastungspunkte). Steigt langsam, wenn du regelmäßig trainierst. Fachbegriff: CTL (Chronic Training Load).'],
  ermuedung:['Ermüdung','Deine Trainingslast der letzten ~7 Tage. Reagiert schnell – nach harten Tagen steigt sie stark. Fachbegriff: ATL (Acute Training Load).'],
  form:['Form','Fitness minus Ermüdung. Negativ = du baust gerade auf (müde, aber es wirkt). Leicht positiv = frisch. Vor dem Rennen willst du +5 bis +15. Fachbegriff: TSB (Training Stress Balance).'],
  bereitschaft:['Tagesbereitschaft','VELOX’ Einschätzung (0–100), wie bereit du heute für eine harte Einheit bist – aus Form, gestriger Belastung, Schlaf, Ruhepuls, HRV und deinem Gefühl.'],
  intensitaet:['Intensität','Wie hart eine Einheit im Verhältnis zu deiner Leistungsgrenze (Schwelle) war. 100 % = Schwelle. Locker ≈ 60–75 %, zügig ≈ 80–90 %, harte Intervalle ≈ 95–110 %. Fachbegriff: IF (Intensity Factor).'],
  schwelle:['Schwelle','Das Tempo bzw. die Leistung, die du etwa 60 Minuten lang durchhalten könntest. Darüber übersäuern die Muskeln schnell. Die wichtigste Größe für einen Halbmarathon – je höher, desto schneller bist du.'],
  ftp:['FTP','Functional Threshold Power: deine Schwelle auf dem Rad in Watt – die Leistung, die du ~1 Stunde treten kannst. Bestimmt alle Watt-Ziele. Test: 20 min all-out × 0,95.'],
  wkg:['W/kg','Watt pro Kilogramm Körpergewicht. Entscheidend am Berg: Je höher, desto schneller kletterst du. Ambitionierte Amateure: 3,5–4,5 W/kg.'],
  zonen:['Trainingszonen','Intensitätsbereiche von Z1 (sehr locker) bis Z5/Z6 (sehr hart). Jede Zone trainiert etwas anderes: Z2 Ausdauer & Fettstoffwechsel, Z4 Schwelle, Z5 maximale Sauerstoffaufnahme.'],
  zone2:['Zone 2 / Grundlage','Lockeres Tempo, bei dem du dich noch unterhalten kannst. Hier entsteht die Ausdauer-Basis. Rund 80 % deines Trainings sollte so locker sein.'],
  sweetspot:['Sweet Spot','Rad-Intensität knapp unter der Schwelle (88–93 % FTP). „Süßer Punkt“, weil sie viel Trainingswirkung bei überschaubarer Ermüdung bringt.'],
  vo2max:['VO2max','Die maximale Menge Sauerstoff, die dein Körper pro Minute verwerten kann – dein „Motor-Hubraum“. Trainiert durch harte 2–5-minütige Intervalle.'],
  pace:['Pace','Lauftempo in Minuten pro Kilometer. 6:00 /km = ein Kilometer dauert 6 Minuten. Kleiner = schneller.'],
  hmtempo:['HM-Tempo','Die Pace, die du im Halbmarathon laufen willst bzw. kannst. Ergibt sich aus Zielzeit oder Prognose. Im Training wird sie in Blöcken geübt.'],
  steigerungen:['Steigerungen (Beschleunigungen)','Kurze Abschnitte von ~20 Sekunden, in denen du locker bis auf ~90 % beschleunigst – kein Sprint. Verbessert Laufstil und Schrittökonomie, macht kaum müde.'],
  tempowechsel:['Tempowechsel-Lauf','Lauf, bei dem du immer wieder kurz schneller und dann wieder locker läufst. Im Fachjargon „Fahrtspiel“ (schwedisch: Fartlek).'],
  progression:['Steigerungslauf','Ein Lauf, der langsam beginnt und Abschnitt für Abschnitt schneller wird. Trainiert, mit müden Beinen Tempo zu machen. Fachbegriff: Progressionslauf.'],
  tapering:['Tapering','Die letzten 1–2 Wochen vor dem Rennen: Umfang runter, kurze Tempoanteile bleiben. Ziel: frisch und schnell an der Startlinie.'],
  entlastung:['Entlastungswoche','Jede 4. Woche reduziert VELOX den Umfang um ~25 %. Der Körper verarbeitet dann die Reize der Vorwochen – danach bist du stärker.'],
  rpe:['Anstrengung (RPE)','Rate of Perceived Exertion: dein Gefühl von 1 (sehr leicht) bis 10 (maximal). Hilft VELOX, die Belastung auch ohne Puls/Watt einzuschätzen.'],
  np:['NP (Normalized Power)','„Gewichtete Leistung“ auf Strava. Berücksichtigt, dass Spitzen mehr ermüden als gleichmäßiges Treten. Besser als Ø-Watt für die Belastung.'],
  kadenz:['Kadenz','Schritte pro Minute beim Laufen (gut: 165–180) bzw. Kurbelumdrehungen pro Minute beim Rad (meist 80–95).'],
  ruhepuls:['Ruhepuls','Puls morgens in Ruhe. Liegt er 5+ Schläge über deinem Normalwert, ist das ein Zeichen für Ermüdung, Stress oder beginnende Krankheit.'],
  hrv:['HRV','Herzfrequenzvariabilität: Schwankung zwischen Herzschlägen in ms. Hoch = erholt, deutlich unter deinem Normalwert = Körper ist gestresst. Individuell – nur mit dir selbst vergleichen.'],

const RPE_IF=[0,.5,.55,.6,.65,.7,.75,.8,.88,.95,1.05];

function thrPaceRaw(){return memo('thr',()=>{
  const set=parsePace(S.settings.thrPace);if(set)return{v:set,src:'eingestellt'};

function lineChart(ser,labels,o={}){
  const W=340,H=o.h||150,pl=32,pr=8,pt=10,pb=20;const all=ser.flatMap(s=>s.v.filter(x=>x!=null));if(!all.length)return`<div class="empty">${ic('chart')}Noch keine Daten</div>`;if(o.hline!=null)all.push(o.hline);

  const n=labels.length,x=i=>pl+(n<2?(W-pl-pr)/2:i*(W-pl-pr)/(n-1)),y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);let g='';
  if(o.bands)o.bands.forEach(b=>{const y1=y(Math.min(b[1],mx)),y0=y(Math.max(b[0],mn));if(y0>y1)g+=`<rect x="${pl}" y="${y1}" width="${W-pl-pr}" height="${y0-y1}" fill="${b[2]}" opacity=".09"/>`});
  for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3,yy=y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--card2)"/><text x="${pl-4}" y="${yy+3}" text-anchor="end">${o.fmt?o.fmt(v):Math.round(v)}</text>`}
  if(o.zero&&mn<0&&mx>0)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  const step=Math.max(1,Math.ceil(n/5));labels.forEach((l,i)=>{if(i%step===0)g+=`<text x="${x(i)}" y="${H-5}" text-anchor="middle">${l}</text>`});
  ser.forEach((s,si)=>{let d='';s.v.forEach((v,i)=>{if(v==null)return;d+=(d?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)});
    if(s.fill&&d){const f=s.v.findIndex(v=>v!=null),lI=s.v.length-1-[...s.v].reverse().findIndex(v=>v!=null);g+=`<path d="${d}L${x(lI)} ${H-pb}L${x(f)} ${H-pb}Z" fill="${s.c}" opacity=".13"/>`}
    if(!s.dots||s.line)g+=`<path class="draw" style="animation-delay:${si*150}ms" d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2.2}" ${s.dash?'stroke-dasharray="4 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.dots)s.v.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.3" fill="${s.c}" stroke="var(--card)" stroke-width="1.5"/>`});
    if(s.last){const li=s.v.length-1-[...s.v].reverse().findIndex(v=>v!=null);if(s.v[li]!=null)g+=`<circle cx="${x(li)}" cy="${y(s.v[li])}" r="4.5" fill="${s.c}" stroke="var(--card)" stroke-width="2"/>`}});
  if(o.hline!=null)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(o.hline)}" y2="${y(o.hline)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`}

function parseWorkout(text,ref){
  const T=ocrNorm(text),L=T.toLowerCase(),lines=T.split('\n'),r={found:[]};

  else if(/schwimm|swim|becken|pool/.test(L))r.sport='swim';
  else if(/radfahrt|rad fahren|radfahren|fahrrad|outdoor[\s-]?rad|cycling|\bride\b|rennrad|gravel|mountainbike/.test(L))r.sport='ride';
  else if(/lauf|\brun\b|running|joggen/.test(L))r.sport='run';
  else if(/spazier|\bgehen\b|\bwalk|wander|hike/.test(L))r.sport='walk';

    const after=T.slice(m.index+m[0].length,m.index+m[0].length+8),before=T.slice(Math.max(0,m.index-3),m.index);
    if(/^\s*"?\s*(min)?\s*\/\s*km/i.test(after))return;if(/^\s*-\s*\d/.test(after)||/-\s*$/.test(before))return;if(/^\s*uhr/i.test(after))return;
    const lineIdx=T.slice(0,m.index).split('\n').length-1;
    let s;if(m[3]!=null)s=+m[1]*3600+ +m[2]*60+ +m[3];else{if(lineIdx===0)return;s=+m[1]*60+ +m[2]}

async function fetchWx(force){const w=S.settings.wx;if(!w.on||w.lat==null)return;
  if(!force&&WX&&WX.lat===w.lat&&WX.lon===w.lon&&Date.now()-WX.t<45*60e3)return;

    const r=await fetch(u);if(!r.ok)throw 0;const data=await r.json();let aq=null;
    try{const ra=await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${w.lat}&longitude=${w.lon}&current=european_aqi,pm2_5,ozone,alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,ragweed_pollen&timezone=auto`);if(ra.ok)aq=await ra.json()}catch(e){}

    if(!$('#ov').classList.contains('on')&&!LK&&(TAB==='home'||TAB==='cal'))render();if(force)toast('🌤️ Wetter aktualisiert')}
  catch(e){if(force)toast(ic('warn')+' Wetter konnte nicht geladen werden')}}

  return{k,wc:d.weather_code[i],tmax:d.temperature_2m_max[i],tmin:d.temperature_2m_min[i],amin:d.apparent_temperature_min[i],pp:d.precipitation_probability_max[i]??0,pr:d.precipitation_sum[i]??0,ws:d.wind_speed_10m_max[i],rise:(d.sunrise[i]||'').slice(11,16),set:(d.sunset[i]||'').slice(11,16)}}

const isIcy=x=>(x.wc>=56&&x.wc<=57)||(x.wc>=66&&x.wc<=67)||((x.wc>=71&&x.wc<=77||x.wc>=85)&&x.a<=1);

function coachWx(p){if(!p||!wxOk())return null;const k=p.date,day=wxDay(k);if(!day)return null;
  const isToday=k===ymd(today()),nowH=new Date().getHours(),bikeOut=p.sport==='ride',indoor=p.sport==='zwift'||p.sport==='strength';

const fmtHM=v=>{v=Math.round(v/60);return Math.floor(v/60)+':'+pad(v%60)};
function hmForecast(){const cur=hmPred();if(!cur)return null;const t0=today(),ws=weekStart(t0),rd=S.settings.raceDate?parse(S.settings.raceDate):null;
  const W=rd?Math.max(0,Math.round(dBetween(t0,rd)/7)):0,tg=parseTime(S.settings.targetTime);
  // Verlauf: Prognose am Ende jeder der letzten 12 Wochen
  const hist=[];for(let i=11;i>=0;i--){const e=addD(ws,-7*i+6),k=ymd(e>t0?t0:e),p=hmPred(42,k);hist.push(p?p.t:null)}
  if(hist[11]==null)hist[11]=cur.t;
  // Konstanz der letzten 4 Wochen
  const lim=ymd(addD(t0,-28)),runs=S.sessions.filter(s=>s.sport==='run'&&s.date>=lim&&s.date<=ymd(t0)),rpw=runs.length/4,kpw=sum(runs,s=>s.distKm||0)/4;
  let r=.0025+.001*Math.min(rpw,3.5);if(kpw<12)r*=.75;if(kpw>=25)r*=1.15;
  const capGain=.07,proj=f=>{const out=[];for(let w=0;w<=W;w++){const cf=capGain*f,g=cf*(1-Math.exp(-r*f*w/cf));let t=cur.t*(1-g);if(w===W&&W>0)t*=.985;out.push(t)}return out};
  const mid=proj(1),opt=proj(1.4),con=proj(.5);
  // beobachteter Trend (s/Woche) aus den letzten 8 Wochen
  const hv=hist.map((v,i)=>[i,v]).slice(4).filter(x=>x[1]!=null);let trend=null;
  if(hv.length>=3&&hv[hv.length-1][0]-hv[0][0]>=3){const n=hv.length,mx=avg(hv.map(x=>x[0])),my=avg(hv.map(x=>x[1]));trend=sum(hv,x=>(x[0]-mx)*(x[1]-my))/sum(hv,x=>(x[0]-mx)**2)}
  const end=mid[mid.length-1],endO=opt[opt.length-1],endC=con[con.length-1];
  let verdict=null;if(tg){verdict=tg>=endC?['good','Sehr wahrscheinlich','Selbst mit wenig Fortschritt schaffst du das. Du könntest dein Ziel sogar etwas schärfer stellen.']:tg>=end?['good','Realistisch','Wenn du weiter so dranbleibst wie bisher, passt das.']:tg>=endO?['warn','Ambitioniert','Machbar, braucht aber konstante 3–4 Läufe pro Woche ohne längere Pausen.']:['bad','Sehr ambitioniert','Aus heutiger Sicht schwer. Ein Zwischenziel wäre sinnvoll – oder das Ziel nach dem nächsten 5-km-Test neu bewerten.']}
  const need=tg&&W>0&&tg<cur.t?1-Math.pow(tg/cur.t,1/W):0;
  return{cur,W,tg,hist,mid,opt,con,end,endO,endC,trend,verdict,need,r,rpw,kpw}}
function fcChart(F){const lab=[],H=[],M=[],O=[],C=[];const ws=weekStart(today());
  for(let i=11;i>=0;i--){lab.push(i?'−'+i+' W':'Heute');H.push(F.hist[11-i]);M.push(i?null:F.mid[0]);O.push(i?null:F.opt[0]);C.push(i?null:F.con[0])}
  for(let w=1;w<=F.W;w++){lab.push(w===F.W?'🏁':`+${w}`);H.push(null);M.push(F.mid[w]);O.push(F.opt[w]);C.push(F.con[w])}
  // Label-Ausdünnung: Monatskürzel
  const L=lab.map((l,i)=>fmtDate(ymd(addD(ws,7*(i-11))),{month:'short'}));
  return lineChart([{v:O,c:'var(--good)',w:1.3,dash:true},{v:C,c:'var(--warn)',w:1.3,dash:true},{v:M,c:'var(--accent)',w:2.6,last:true},{v:H,c:sc('run'),dots:true,line:true,w:1.8}],L,{fmt:fmtHM,h:190,hline:F.tg||null})}
function fcCard(){const F=hmForecast();if(!F)return`<div class="card fade"><div class="lbl">${ic('flag')} Halbmarathon-Prognose</div><div class="empty">${ic('run')}Trag einen Lauf ab 3 km oder deine 5-km-Zeit im Setup ein – dann rechnet VELOX deine Zielzeit hoch.</div></div>`;

function seasonTemp(){const m=today().getMonth();return[3,3,7,11,15,18,20,20,16,11,7,4][m]}
function fuelPlan(p){if(!p||!p.durMin)return null;const F=S.settings.fuel,cat=SPORTS[p.sport]?.cat,bike=cat==='bike',run=cat==='run',indoor=p.sport==='zwift';if(!bike&&!run&&p.sport!=='swim')return null;
  const h=p.durMin/60,IF=p.IF||.7,kg=weightE()||75,wc=wxOk()?coachWx(p):null,temp=indoor?20:(wc?wc.feel:seasonTemp()),hardish=IF>=.82;
  const r={h,kg,temp,indoor,before:[],after:[],pack:[],tl:[],notes:[]};
  // Kohlenhydrate pro Stunde
  let cph=h<1?0:h<1.5?(hardish?30:20):h<2.5?(hardish?60:45):(hardish?80:60);if(run)cph=Math.min(cph,h>2.5?70:60);if(p.sport==='swim')cph=0;
  r.cph=cph;r.carbs=Math.round(cph*Math.max(0,h-.25));
  // Flüssigkeit & Natrium
  let ml=temp<10?450:temp<20?550:temp<25?700:850;if(indoor)ml+=250;if(hardish)ml+=100;if(run)ml-=100;r.mlh=ml;r.fluid=h<.75?0:Math.round(ml*h/50)*50;
  r.naL=(h>=1.5||temp>=22||indoor)?(temp>=25||indoor?700:500):0;
  if(h<1&&!hardish){r.short=true;r.summary=indoor?`💧 ${Math.round(Math.max(500,ml*h)/50)*50} ml Wasser bereitstellen`:'💧 Wasser reicht – vorher normal essen';
    r.before.push('Normal essen, nicht direkt vorher schwer.');if(indoor)r.pack.push(`${Math.round(Math.max(500,ml*h)/50)*50} ml Wasser`);r.info=`Unter 1 h locker – keine Extra-Kohlenhydrate nötig`;return r}
  // Flaschen
  const cont=bike?F.bottle:F.flask;let nC=r.fluid?Math.max(1,Math.ceil(r.fluid/cont)):0;const carry=bike?F.holders:(r.fluid>300?1:0);if(run&&nC>1){r.notes.push(`Rest (~${Math.round((r.fluid-cont)/50)*50} ml) vorher/nachher trinken – oder Runde am Auto/zu Hause vorbeiplanen.`);nC=1}if(run&&h<1.25)nC=0;
  let carbBottle=0,maltoPer=0;
  if(F.malto&&nC&&r.carbs>0){const share=r.carbs<=40?1:run?.35:.5,maxPer=cont*.11;maltoPer=Math.round(Math.min(maxPer,r.carbs*share/nC)/.95/5)*5;if(maltoPer<15)maltoPer=r.carbs<=40?Math.min(15,Math.round(maxPer/5)*5):0;carbBottle=Math.round(maltoPer*.95*nC)}
  const elecPer=F.elec&&r.naL?Math.max(1,Math.round(r.naL*cont/1000/(F.elecMg||500))):0;
  let rest=Math.max(0,r.carbs-carbBottle);if(rest<12)rest=0;const solids=[];
  const add=(n,kh,label)=>{const c=Math.max(0,Math.ceil(n));if(c)solids.push([c,kh,label]);return c*kh};
  if(rest>0){
    if(run){if(F.gels)rest-=add(rest/F.gelKH,F.gelKH,'Gel');else if(F.dates)rest-=add(rest/F.dateKH,F.dateKH,'Datteln')}
    else{const gs=hardish?.6:.35;let g=0;if(F.gels)g=add(rest*gs/F.gelKH,F.gelKH,'Gel');rest-=g;
      if(rest>0&&F.dates)rest-=add(rest/F.dateKH,F.dateKH,'Datteln');if(rest>0&&F.bars)rest-=add(rest/F.barKH,F.barKH,'Riegel');if(rest>0&&F.banana)rest-=add(rest/25,25,'Banane');if(rest>0&&F.gels)add(rest/F.gelKH,F.gelKH,'Gel')}}
  // merge same labels
  const m={};solids.forEach(([c,kh,l])=>{m[l]=m[l]||{c:0,kh};m[l].c+=c});
  // Packliste
  if(nC)r.pack.push(`${nC}× ${cont} ml${maltoPer?` mit ${nC>1?"je ":""}${maltoPer} g Maltodextrin`:''}${elecPer?` + ${elecPer} ${F.elecUnit}${elecPer>1&&F.elecUnit==='Tab'?'s':''} Elektrolyt`:''}`);
  Object.entries(m).forEach(([l,v])=>r.pack.push(`${v.c} ${l==='Gel'?(v.c>1?'Gels':'Gel'):l==='Datteln'?(v.c>1?'Datteln':'Dattel'):l==='Riegel'?'Riegel':(v.c>1?'Bananen':'Banane')}`));
  if(F.gels&&h>=2&&r.carbs&&!run)r.pack.push('+1 Gel als Notreserve');
  if(nC>carry&&carry)r.notes.push(`Du brauchst ${nC} Füllungen, hast aber ${carry} Halter → ${nC-carry}× unterwegs nachfüllen (Tanke, Bäcker, Friedhof).`);
  if(!bike&&nC&&h<1.25)r.pack.splice(0,1,`${Math.round(r.fluid/50)*50} ml Wasser vorher/nachher – mitnehmen optional`);
  // Zeitplan
  const iv=30,startM=bike?30:40,endM=p.durMin-15;const slots=[];for(let t=startM;t<=endM;t+=iv)slots.push(t);const nItems=Object.entries(m).reduce((a,[l,v])=>a+v.c,0);
  const q=[];Object.entries(m).forEach(([l,v])=>{const per=l==='Datteln'&&nItems>slots.length?2:1;for(let i=0;i<v.c;i+=per)q.push(l==='Datteln'?(Math.min(per,v.c-i)===2?'2 Datteln':'1 Dattel'):l==='Gel'?'1 Gel':l==='Riegel'?'½ Riegel':'½ Banane')});
  if(q.length&&slots.length){const order=[];const g=q.filter(x=>x.includes('Gel')),o=q.filter(x=>!x.includes('Gel'));while(o.length||g.length){if(o.length)order.push(o.shift());if(g.length&&(order.length%2===0||!o.length))order.push(g.shift())}
    slots.forEach((t,i)=>{const it=order[i];if(it)r.tl.push([t,it])});const left=order.slice(slots.length);if(left.length&&r.tl.length)r.tl[r.tl.length-1][1]+=' + '+left.join(' + ')}
  if(nC)r.tl.unshift([10,`trinken: alle 15 min ein paar Schlucke (~${Math.round(ml/4/10)*10} ml)`]);
  // Vorher / Nachher
  if(h>=2.5)r.before.push(`Am Vorabend kohlenhydratreich essen (Nudeln, Reis, Kartoffeln).`);
  if(h>=1.5)r.before.push(`2–3 h vorher: ~${Math.round(kg*1.5/10)*10} g Kohlenhydrate (z. B. Haferflocken mit Banane & Honig, Brötchen mit Marmelade).`);else r.before.push('1–2 h vorher eine normale, leichte Mahlzeit.');
  if(hardish||h>=2)r.before.push('15–30 min vorher: 2 Datteln oder ½ Banane, 300–500 ml trinken.');
  if(h>=1||hardish)r.after.push(`Innerhalb 1 h: ~${Math.round(kg*1/10)*10} g Kohlenhydrate + 25 g Eiweiß (z. B. Skyr mit Haferflocken, Reis mit Hähnchen, Kakao).`);
  if(r.fluid)r.after.push(`~${Math.round(r.fluid*.5/50)*50} ml nachtrinken – mit etwas Salz oder einem Elektrolyt${F.elecUnit==='Tab'?'-Tab':''}.`);
  r.summary=`🎒 ${r.pack.slice(0,3).join(' · ')}`;
  r.info=`${r.cph?`${r.cph} g Kohlenhydrate/h`:'keine Kohlenhydrate nötig'} · ~${Math.round(ml/50)*50} ml/h${r.naL?` · ~${r.naL} mg Natrium/l`:''}${wc?` · ${Math.round(temp)}° gefühlt`:indoor?' · Indoor':''}`;
  return r}

function estDur(sport,km,hm,int){km=num(km)||0;hm=num(hm)||0;if(!km)return null;const cat=SPORTS[sport]?.cat;
  if(cat==='bike'){const v=sport==='zwift'?30:int==='hart'?30:int==='lang'?27:26;return Math.round((km/v+hm*.0004)*60)}
  if(cat==='run'){const P=paces(),pace=int==='hart'?P.thr*1.03:P.thr*1.25;return Math.round(km*pace/60+hm/100)}
  if(sport==='swim')return Math.round(km*25);return null}

/* Sprint-Duell: Radfahrer vs. Läufer reißen den Sperrbildschirm auf */
function sprintDuel(el,fin){
  const W=innerWidth,H=innerHeight,th=S.settings.theme,cRun=th.accent,cBike=sc('ride'),y1=Math.round(H*.42),y2=Math.round(H*.62);
  const st=document.createElement('div');st.className='stage';
  const bg=top=>`background-position:0 -${top}px`;
  st.innerHTML=`<div class="sl s1" style="top:0;height:${y1}px;${bg(0)}"></div><div class="sl s2" style="top:${y1}px;height:${y2-y1}px;${bg(y1)}"></div><div class="sl s3" style="top:${y2}px;bottom:0;${bg(y2)}"></div>
    <div class="road" style="top:${y1+46}px"></div><div class="road" style="top:${y2+46}px"></div><canvas></canvas>
    <div class="trail" id="tb" style="top:${y1+18}px;background:linear-gradient(90deg,transparent,${cBike});box-shadow:0 0 18px ${cBike}"></div>
    <div class="trail" id="tr" style="top:${y2+20}px;background:linear-gradient(90deg,transparent,${cRun});box-shadow:0 0 18px ${cRun}"></div>
    <div class="ath" id="ab" style="filter:drop-shadow(0 0 10px ${cBike}) drop-shadow(0 0 26px ${cBike})">${ic('ride')}</div>
    <div class="ath" id="ar" style="filter:drop-shadow(0 0 10px ${cRun}) drop-shadow(0 0 26px ${cRun})">${ic('run')}</div>
    <div class="ttl" id="ttl">Los geht's${S.settings.name?', '+esc(S.settings.name):''}!</div>`;
  el.appendChild(st);el.classList.add('run');
  const cv=st.querySelector('canvas'),dpr=devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  const ab=$('#ab',st),ar=$('#ar',st),tb=$('#tb',st),tr=$('#tr',st),ttl=$('#ttl',st);
  const streaks=Array.from({length:46},()=>({x:Math.random()*W,y:Math.random()*H,l:30+Math.random()*120,v:14+Math.random()*26,a:.15+Math.random()*.35}));
  const sparks=[];const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,2.2);
  const D=1250,t0=performance.now();let done=false;
  (function f(t){const k=t-t0;x.clearRect(0,0,W,H);
    // Speed-Streaks
    x.lineCap='round';streaks.forEach(s=>{s.x-=s.v*(k<D?1:.4);if(s.x<-s.l){s.x=W+Math.random()*80;s.y=Math.random()*H}x.strokeStyle=`rgba(255,255,255,${s.a})`;x.lineWidth=1.4;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x+s.l,s.y);x.stroke()});
    // Positionen: Läufer startet vorne, Radfahrer überholt
    const pr=-90+(W+200)*ease((k-60)/(D-80)),pb=-160+(W+280)*ease((k-180)/(D-260));
    const bob=Math.abs(Math.sin(k/55))*12;
    ar.style.transform=`translate(${pr}px,${y2-bob}px) rotate(${-4+Math.sin(k/55)*4}deg)`;
    ab.style.transform=`translate(${pb}px,${y1}px) rotate(${Math.sin(k/90)*2-3}deg)`;
    tr.style.width=Math.max(0,pr-20)+'px';tb.style.width=Math.max(0,pb-20)+'px';
    // Funken hinter dem Rad
    if(k<D&&pb>-40&&pb<W+40)for(let i=0;i<3;i++)sparks.push({x:pb-34,y:y1+40,vx:-3-Math.random()*6,vy:-Math.random()*3,l:1,c:Math.random()<.5?cBike:'#fff'});
    if(k<D&&pr>-40&&pr<W+40&&Math.random()<.5)sparks.push({x:pr-20,y:y2+44,vx:-2-Math.random()*3,vy:-Math.random()*2,l:1,c:cRun});
    sparks.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.l-=.035;if(p.l>0){x.globalAlpha=p.l;x.fillStyle=p.c;x.fillRect(p.x,p.y,3,3)}});x.globalAlpha=1;
    for(let i=sparks.length-1;i>=0;i--)if(sparks[i].l<=0)sparks.splice(i,1);
    ttl.style.opacity=k>350&&k<D+150?Math.min(1,(k-350)/200):0;ttl.style.transform=`scale(${1+Math.max(0,k-350)/4000})`;
    if(k>=D+60&&!done){done=true;st.classList.add('cut');if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}
      setTimeout(()=>{st.classList.add('open');const a=$('#app');a.classList.remove('settle');void a.offsetWidth;a.classList.add('settle')},180);
      setTimeout(fin,950)}
    if(el.isConnected&&k<D+1000)requestAnimationFrame(f)})(t0)}

const cmpVer=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0};
const latestVer=()=>localStorage.getItem('velox.latest');
const updAvail=()=>{const l=latestVer();return l&&cmpVer(l,VERSION)>0?l:null};
async function checkUpdate(manual){
  if(location.protocol==='file:'){if(manual)toast('Update-Prüfung nur über deine GitHub-Adresse möglich');return}
  if(!manual&&Date.now()-(+localStorage.getItem('velox.lastCheck')||0)<30*60e3)return;
  try{const base=location.pathname.replace(/[^/]*$/,'');const r=await fetch(base+'index.html?check='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;
    const m=(await r.text()).match(/VERSION='([\d.]+)'/);if(!m)throw 0;localStorage.setItem('velox.latest',m[1]);localStorage.setItem('velox.lastCheck',Date.now());
    if(cmpVer(m[1],VERSION)>0){if(manual)openUpdate();else if(TAB==='home'&&!$('#ov').classList.contains('on'))render()}
    else if(manual){toast(ic('check')+' Du hast die neueste Version (v'+VERSION+')');if(TAB==='set')render()}}
  catch(e){if(manual)toast(ic('warn')+' Update-Prüfung fehlgeschlagen – Internet?')}}
async function autoUpdate(force){
  if(location.protocol==='file:')return false;
  if(!force&&Date.now()-(+sessionStorage.getItem('velox.autoChk')||0)<5*60e3)return false;sessionStorage.setItem('velox.autoChk',Date.now());
  try{const ctl=new AbortController();setTimeout(()=>ctl.abort(),5000);const base=location.pathname.replace(/[^/]*$/,'');
    const r=await fetch(base+'index.html?check='+Date.now(),{cache:'no-store',signal:ctl.signal});if(!r.ok)return false;
    const m=(await r.text()).match(/VERSION='([\d.]+)'/);if(!m)return false;localStorage.setItem('velox.latest',m[1]);localStorage.setItem('velox.lastCheck',Date.now());
    if(cmpVer(m[1],VERSION)<=0)return false;
    if(sessionStorage.getItem('velox.tried')===m[1])return false;
    if($('#ov').classList.contains('on')&&!LK&&!force){if(TAB==='home')render();return false}
    sessionStorage.setItem('velox.tried',m[1]);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;text-align:center;color:var(--text)';
    o.innerHTML=`<div><div style="font-size:56px">🚀</div><div class="mid" style="margin-top:8px">Update auf v${m[1]}</div><div class="small muted" style="margin-top:4px">wird installiert …</div></div>`;document.body.appendChild(o);
    setTimeout(()=>location.replace(base+'?v='+m[1]+'&t='+Date.now()),700);return true}catch(e){return false}}
function openUpdate(){const l=updAvail();openSheet(`${sheetHead('Update')}<div style="text-align:center;margin:16px 0"><div style="font-size:54px">🚀</div><div class="mid">Neue Version verfügbar</div><div class="small muted" style="margin-top:4px">Installiert: v${VERSION} → Neu: <b style="color:var(--accent)">v${l}</b></div></div>
  <div class="card small">Deine Daten bleiben beim Aktualisieren vollständig erhalten – sie liegen auf dem Gerät und (falls eingerichtet) verschlüsselt in der Cloud.</div>
  <button class="btn acc full" style="margin-top:14px;padding:15px" data-act="doUpdate">${ic('download')} Jetzt aktualisieren</button>`)}
function doUpdate(){const l=updAvail()||'';try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}const base=location.pathname.replace(/index\.html$/,'');location.replace(base+'?v='+l+'&t='+Date.now())}

(function(){const sh=$('#sheet'),ov=$('#ov');let y0=null,dy=0,t0=0,drag=false;
  sh.addEventListener('touchstart',e=>{if(LOCK||e.touches.length>1)return;const tg=e.target;if(tg.closest('input[type=range],textarea,select'))return;if(sh.scrollTop>2&&!tg.closest('.grab'))return;y0=e.touches[0].clientY;t0=Date.now();dy=0;drag=false},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(!drag&&(dy<6||sh.scrollTop>2)){if(dy<0)y0=null;return}drag=true;e.preventDefault();sh.style.transition='none';sh.style.transform=`translateY(${Math.max(0,dy)}px)`;ov.style.backgroundColor=`rgba(0,0,0,${Math.max(.15,.6-dy/700)})`},{passive:false});
  sh.addEventListener('touchend',()=>{if(y0==null)return;const v=dy/Math.max(1,Date.now()-t0);y0=null;if(!drag)return;drag=false;
    if(dy>110||v>.65){sh.style.transition='transform .22s ease-in';sh.style.transform='translateY(110%)';setTimeout(()=>{closeSheet();sh.style.transform='';sh.style.transition='';ov.style.backgroundColor=''},210)}
    else{sh.style.transition='transform .3s cubic-bezier(.2,.8,.2,1)';sh.style.transform='';ov.style.backgroundColor='';setTimeout(()=>sh.style.transition='',300)}})})();

let syncState='off';const FILE='velox-data.json';let syncBusy=false;
const syncReady=()=>{const y=S.settings.sync;return!!(y.token&&y.pass&&y.gistId)};
function gh(path,opt={}){return fetch('https://api.github.com'+path,Object.assign({},opt,{headers:{Authorization:'Bearer '+S.settings.sync.token,Accept:'application/vnd.github+json','Content-Type':'application/json'}})).then(r=>{if(r.status===401)throw new Error('Token ungültig');if(r.status===404)throw new Error('Gist nicht gefunden');if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
const u8b64=u=>{let s='';const b=new Uint8Array(u);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
const b64u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const keyCache={};
async function deriveKey(pass,saltB64){const id=saltB64+'|'+pass;if(keyCache[id])return keyCache[id];
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return keyCache[id]=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64u8(saltB64),iterations:210000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptState(obj){const y=S.settings.sync;if(!y.salt)y.salt=u8b64(crypto.getRandomValues(new Uint8Array(16)));
  const key=await deriveKey(y.pass,y.salt),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({app:'velox',v:1,enc:'AES-256-GCM',kdf:'PBKDF2-SHA256',it:210000,salt:y.salt,iv:u8b64(iv),data:u8b64(ct),at:new Date().toISOString()})}
async function decryptPayload(txt){const p=JSON.parse(txt);if(!p.enc){if(p.sessions)return p;throw new Error('Unbekanntes Format')}
  const key=await deriveKey(S.settings.sync.pass,p.salt);
  try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(p.iv)},key,b64u8(p.data));S.settings.sync.salt=p.salt;return JSON.parse(new TextDecoder().decode(pt))}
  catch(e){throw new Error('Falsches Sync-Passwort')}}
function cleanForCloud(){const d=JSON.parse(JSON.stringify(S));d.settings.sync={auto:S.settings.sync.auto};return d}
function mergeStates(loc,rem){const newer=(rem.updated||0)>(loc.updated||0)?rem:loc,older=newer===rem?loc:rem;
  const del=new Set([...(loc.deleted||[]),...(rem.deleted||[])]),m={};
  [...(older.sessions||[]),...(newer.sessions||[])].forEach(x=>{if(!del.has(x.id))m[x.id]=x});
  const out=hydrate(JSON.parse(JSON.stringify(newer)));
  out.sessions=Object.values(m);out.deleted=[...del].slice(-500);
  ['daily','planLog','badges','seen','meta','dismissed'].forEach(k=>{out[k]=Object.assign({},older[k]||{},newer[k]||{})});
  if(newer===rem){out.settings.sync=loc.settings.sync}
  out.updated=Math.max(loc.updated||0,rem.updated||0);return out}
function setSync(st){syncState=st;$$('.syncb').forEach(b=>{b.className='syncb '+st})}
async function syncNow(silent){if(!syncReady()){if(!silent)openSyncInfo();return}if(syncBusy)return;syncBusy=true;setSync('busy');
  try{const sy=S.settings.sync;const g=await gh('/gists/'+sy.gistId),f=g.files[FILE];
    if(f){let txt=f.content;if(f.truncated)txt=await fetch(f.raw_url).then(r=>r.text());const remote=await decryptPayload(txt);const before=JSON.stringify(S.sessions.length)+S.updated;
      S=mergeStates(S,remote);_cache={};localStorage.setItem(KEY,JSON.stringify(S));if(before!==JSON.stringify(S.sessions.length)+S.updated&&!$('#ov').classList.contains('on'))render()}
    await gh('/gists/'+sy.gistId,{method:'PATCH',body:JSON.stringify({files:{[FILE]:{content:await encryptState(cleanForCloud())}}})});
    S.settings.sync.last=Date.now();localStorage.setItem(KEY,JSON.stringify(S));setSync('ok');if(!silent){toast('👟 Synchronisiert & verschlüsselt');if(TAB==='set')render()}}
  catch(e){setSync('err');S.settings.sync.lastErr=e.message;if(!silent)toast(ic('warn')+' '+e.message,3500)}finally{syncBusy=false}}
async function syncSetup(){collectSync();const y=S.settings.sync;
  if(!y.token){toast('Bitte GitHub-Token eintragen');return}if(!y.pass||y.pass.length<8){toast('Sync-Passwort: mind. 8 Zeichen');return}
  if(!window.crypto?.subtle){toast('Verschlüsselung braucht https (GitHub-Pages-Adresse öffnen)');return}
  if(y.gistId){if(!y.last){S.updated=0;localStorage.setItem(KEY,JSON.stringify(S))}else save(true);await syncNow(false);render();return}
  setSync('busy');try{const content=await encryptState(cleanForCloud());const r=await gh('/gists',{method:'POST',body:JSON.stringify({description:'VELOX Trainingsdaten (verschlüsselt)',public:false,files:{[FILE]:{content}}})});
    y.gistId=r.id;y.last=Date.now();save(true);setSync('ok');render();toast('👟 Sync eingerichtet – Gist-ID fürs iPad kopieren',3500)}
  catch(e){setSync('err');toast(ic('warn')+' '+e.message,3500)}}
function collectSync(){$$('[data-sync]').forEach(e=>S.settings.sync[e.dataset.sync]=e.value.trim())}
function openSyncInfo(){const y=S.settings.sync,st=syncReady()?syncState:'off';
  openSheet(`${sheetHead('Sync-Status')}<div style="display:grid;place-items:center;margin:18px 0 8px">${syncBadge(true).replace('width:48px;height:48px;font-size:23px','width:84px;height:84px;font-size:40px')}</div>
  <div style="text-align:center"><div class="mid">${{ok:'Synchronisiert & verschlüsselt',busy:'Synchronisiert gerade …',err:'Sync-Fehler',off:'Nur auf diesem Gerät gespeichert'}[st]}</div>
  <div class="small muted" style="margin-top:4px">${st==='off'?'Richte den Sync im Setup ein, um iPhone und iPad abzugleichen.':st==='err'?esc(y.lastErr||'Unbekannter Fehler'):'Zuletzt: '+(y.last?new Date(y.last).toLocaleString('de-DE'):'–')}</div></div>
  <div class="card" style="margin-top:14px">${[['🟢 Grüner Ring','Alles synchronisiert & verschlüsselt'],['🟡 Drehender Ring','Synchronisiert gerade'],['🔴 Roter Ring','Fehler – antippen für Details'],['⚪ Gestrichelt','Sync nicht eingerichtet']].map(([a,b])=>`<div class="kv"><span>${a}</span><b class="small">${b}</b></div>`).join('')}</div>
  ${syncReady()?`<div class="card" style="margin-top:12px"><div class="kv"><span>Verschlüsselung</span><b>AES-256-GCM</b></div><div class="kv"><span>Schlüssel</span><b>aus deinem Passwort (PBKDF2)</b></div><div class="kv"><span>Speicherort</span><b>geheimes GitHub-Gist</b></div></div>`:''}
  <div class="btnrow">${syncReady()?`<button class="btn acc" data-act="syncNow">${ic('sync')} Jetzt synchronisieren</button>`:`<button class="btn acc" data-act="gotoSync">${ic('gear')} Sync einrichten</button>`}</div>`)}
